[package]
name = "sns-secure"
version = "0.1.0"
edition = "2021"

[dependencies]
axum = "0.7"
tokio = { version = "1", features = ["full"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
aws-sdk-sns = "1.11"
aws-config = "1.1"
aws-types = "1.1"
tower-http = { version = "0.5", features = ["limit"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
chrono = "0.4"
jsonwebtoken = "9"
regex = "1"
sha2 = "0.10"
hex = "0.4"
phonenumber = "0.3"
